# ---------------------------------------------------------------------------
# lyme-crawl default configuration (bundled in the jar).
#
# Do not edit secrets in here. Put your own settings into ./crawl.local.properties
# (git-ignored, read automatically if present) or pick another file with
#   mvn exec:java -Dcrawl.config=/path/to/file.properties
#
# Precedence, highest first:
#   1. JVM system properties:   mvn exec:java -Dcrawl.max=50
#   2. the local config file    (crawl.local.properties or -Dcrawl.config=...)
#   3. this file
# An empty value means "not set".
# ---------------------------------------------------------------------------

# --- What to search ---------------------------------------------------------

# Label for this crawl. It becomes part of the output folder name
# (<name>-<config hash>) and is written into the header line of the output file,
# so results can be recognised at a glance. Only letters, digits, '.', '_' and
# '-' are allowed. The name is a label only: it does not enter the config hash.
crawl.name=lyme

# PubMed search term, same syntax as the PubMed web search (field tags such as
# [MeSH Terms], [Title/Abstract], [Author], boolean AND/OR/NOT, parentheses).
# The default covers records indexed with the MeSH headings for Lyme disease or
# Borrelia burgdorferi, plus title/abstract mentions to catch records that are
# not yet MeSH-indexed (recent papers). The free-text part is broader and may
# bring in a few off-topic hits; remove it for a stricter result set.
crawl.query=\
  "Lyme Disease"[MeSH Terms] OR "Borrelia burgdorferi"[MeSH Terms] \
  OR "Lyme disease"[Title/Abstract] OR "Borrelia burgdorferi"[Title/Abstract] \
  OR "Lyme borreliosis"[Title/Abstract]

# Restrict by publication date. Format YYYY, YYYY/MM or YYYY/MM/DD.
# Both must be set, or both left empty (= all years).
crawl.from=
crawl.to=

# --- How much to fetch ------------------------------------------------------

# Maximum number of records to download. 0 = everything the query matches
# (currently roughly 19,000; takes a few minutes with an API key, longer without).
# Use a small value such as 20 to test a new query.
crawl.max=0

# Records per EFetch request. NCBI accepts up to 10,000, but large batches make
# single requests slow and a failed request costs more to repeat. 200 is a
# good compromise.
crawl.batch.size=200

# --- Where to write ---------------------------------------------------------

# Base path for the output in JSON Lines format (one article per line). The file
# actually written has crawl.name and the config hash inserted as a subfolder, e.g.
# data/articles.jsonl -> data/lyme-3f9a1c07/articles.jsonl. The hash is computed over
# the settings that determine the result (crawl.query, crawl.from, crawl.to;
# whitespace in the query is ignored). Each such configuration therefore gets
# its own folder and never mixes with another one. Settings that only affect how
# the crawl runs (crawl.max, crawl.batch.size, crawl.resume, ncbi.*) do not
# change the hash. The first line of the file is a header with the hash and the
# configuration; on resume it is checked and a mismatch aborts the crawl.
# Relative paths are resolved against the directory Maven is started in.
crawl.output=data/articles.jsonl

# true  = resume: articles (by PMID) already in the output file are kept and
#         only the missing ones are downloaded and appended. Use this to
#         continue an interrupted crawl, or to pick up new publications later.
#         A half-written last line from a crash is discarded automatically.
# false = start over: the output file is overwritten.
crawl.resume=true

# --- NCBI identification ----------------------------------------------------

# Contact address sent to NCBI with every request. NCBI asks for this so that
# they can contact you before blocking an IP that misbehaves. If empty, the
# environment variable NCBI_EMAIL is used.
ncbi.email=you@example.org

# NCBI API key (create one in your NCBI account settings). Without a key the
# crawler limits itself to 3 requests/second, with a key to 10 requests/second.
# If empty, the environment variable NCBI_API_KEY is used.
ncbi.api.key=
